import org.apache.tools.ant.taskdefs.condition.Os

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_plugin_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://chocolateminecraft.com/maven" }
	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://maven.aliyun.com/repository/public" }
	mavenCentral()
	maven {
		name = 'xpple'
		url = 'https://maven.xpple.dev/maven2'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"seed-map-for-xaero" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "seed-map-for-xaero-gametest"
		// 服务端 gametest 的 game test server 上 XaeroLib 的 serverStarting 只对
		// DedicatedServer 调 freeze() → registry 永不冻结崩溃；我们只要客户端 E2E。
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// 测试 mod 是独立 source set（gametest），production 运行只收集
// jar/remapJar + productionRuntimeMods —— 打包成 jar 显式加入，否则测试类不加载。
def gametestModJar = tasks.register("gametestModJar", Jar) {
	group = "verification"
	from sourceSets.gametest.output
	archiveBaseName = "seed-map-for-xaero-gametest"
	destinationDirectory = layout.buildDirectory.dir("gametest-mods")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabricApiVersion}"

	// Better PVP 是可选独立 Xaero mod，其 POM 的 `+` 版本可能解析出不兼容旧版
	// World Map 的版本；本 mod 不用它，排除以保证矩阵下 classpath 有效。
	def xaeroMap = "xaero.map:xaeroworldmap-fabric-${project.xaeroMapLine}:${project.xaeroMapVersion}"
	compileOnly(xaeroMap) { exclude group: 'xaero.pvp' }
	runtimeOnly(xaeroMap) { exclude group: 'xaero.pvp' }
	// 旧版 World Map POM 把 XaeroLib 声明为 runtime scope，compileOnly 不携带，
	// 显式声明；`[1.1.0,)` 与 Xaero 自身下限一致，各线解析到最新。
	compileOnly("xaero.lib:xaerolib-fabric-${project.xaeroMapLine}:[1.1.0,)")
	runtimeOnly("xaero.lib:xaerolib-fabric-${project.xaeroMapLine}:[1.1.0,)")
	// dev runtime 加 minimap: waypoint 转换 (SupportMods.minimap()) 需要真实 mod。
	// 仅 runtimeOnly，compileOnly 不引用 (通过 SupportMods 反射式访问)。
	// 注意: minimap 与 worldmap 都内嵌共享的 xaero.common.* 包, 在扁平测试 JVM
	// 类路径上会互相覆盖 (ServiceLoader 报 not a subtype), 故从 testRuntimeClasspath 排除。
	runtimeOnly("xaero.minimap:xaerominimap-fabric-${project.xaeroMapLine}:${project.xaeroMinimapVersion}")

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

	// production 运行的 mods 只来自 jar/remapJar + productionRuntimeMods，
	// fabric-api / xaero / 测试 mod 都要显式声明。
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabricApiVersion}"
	productionRuntimeMods(xaeroMap) { exclude group: 'xaero.pvp' }
	productionRuntimeMods("xaero.lib:xaerolib-fabric-${project.xaeroMapLine}:[1.1.0,)")
	productionRuntimeMods files(gametestModJar)
}

// minimap 只给 dev runClient 用; 排除出测试类路径 (见上方 runtimeOnly 注释)。
configurations {
	testRuntimeClasspath {
		exclude group: 'xaero.minimap'
	}
}

test {
	useJUnitPlatform()
}

// CI headless client gametest（生产运行）：Xvfb + fabric.client.gametest 开关。
tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	jvmArgs.add("-Dfabric.client.gametest")
	// 网络同步器 bug 规避（fabric-docs automatic-testing warning）。
	jvmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
	// CI 无头用 Xvfb；本机有真实 DISPLAY 时直接用（-PclientGameTestXVFB 可覆盖）。
	def xvfbProp = project.findProperty('clientGameTestXVFB')
	useXVFB = (xvfbProp != null) ? (xvfbProp as boolean) : (System.getenv('CI') != null)
}

// 与 runProductionClientGameTest 相同，但 mod 本体使用预构建的 universal jar
// （-PuniversalJar=<path>），从而在任意 MC/Xaero 组合上端到端验证同一个发布产物，
// 而非针对该版本重新编译的 jar。loom 的 AbstractProductionRunTask 构造时把
// remapJar + productionRuntimeMods 塞进 mods 集合，这里用 setFrom 整体替换掉 remapJar。
tasks.register("runProductionClientGameTestUniversal", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	jvmArgs.add("-Dfabric.client.gametest")
	jvmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
	def xvfbProp = project.findProperty('clientGameTestXVFB')
	useXVFB = (xvfbProp != null) ? (xvfbProp as boolean) : (System.getenv('CI') != null)
	def ujar = project.findProperty('universalJar')
	if (ujar) {
		mods.setFrom(files(ujar), configurations.named("productionRuntimeMods"))
	}
}

// ─── Native C build ─────────────────────────────────────────────────────────

def skipNative = project.findProperty('skipNativeBuild') ?: 'false'
def skipNativeWindows = project.findProperty('skipNativeWindows') ?: 'false'

// gradle.local.properties（gitignored）里也可覆盖上面的属性，与 -P 同格式。
def localPropsFile = file('gradle.local.properties')
if (localPropsFile.exists()) {
	def props = new Properties()
	localPropsFile.withInputStream { props.load(it) }
	props.each { k, v -> project.ext[k] = v }
}

ext.JEXTRACT_VERSION = '25'
ext.JEXTRACT_BUILD = '2'
ext.JEXTRACT_REV = '4'

def jextractUrl() {
	def osPart = Os.isFamily(Os.FAMILY_MAC) ?
		(System.getProperty("os.arch") == "aarch64" ? "macos-aarch64" : "macos-x64") :
		Os.isFamily(Os.FAMILY_WINDOWS) ? "windows-x64" : "linux-x64"
	return "https://download.java.net/java/early_access/jextract/${project.JEXTRACT_VERSION}/${project.JEXTRACT_BUILD}/" +
		"openjdk-${project.JEXTRACT_VERSION}-jextract+${project.JEXTRACT_BUILD}-${project.JEXTRACT_REV}_${osPart}_bin.tar.gz"
}

def defaultJextractDir = file("build/jextract/jextract-${project.JEXTRACT_VERSION}")
def defaultJextractBinary = file("${defaultJextractDir}/bin/jextract")
def jextractBinary = project.findProperty('jextractPath')
	? file(project.findProperty('jextractPath').toString()).absolutePath
	: defaultJextractBinary.absolutePath

task downloadJextract() {
	description 'Download pre-built jextract binary from jdk.java.net.'
	onlyIf { !project.hasProperty('jextractPath') && !defaultJextractBinary.exists() }
	doLast {
		defaultJextractDir.parentFile.mkdirs()
		def tarball = file("${defaultJextractDir.parentFile}/jextract.tar.gz")
		def url = jextractUrl()
		logger.lifecycle("Downloading jextract from $url ...")
		new URL(url).withInputStream { i -> tarball.withOutputStream { it << i } }
		logger.lifecycle("Extracting jextract ...")
		new ProcessBuilder('tar', '-xzf', tarball.absolutePath, '-C', defaultJextractDir.parentFile.absolutePath)
			.inheritIO().start().waitFor()
		tarball.delete()
		new ProcessBuilder('chmod', '+x', defaultJextractBinary.absolutePath)
			.inheritIO().start().waitFor()
		logger.lifecycle("jextract ready at $defaultJextractBinary")
	}
}

def defaultCCompiler() {
	// Prefer clang if available (supports cubiomes C patterns on older GCC hosts)
	try {
		def out = new ByteArrayOutputStream()
		exec {
			commandLine 'which', 'clang-21'
			ignoreExitValue true
			standardOutput = out
		}
		return out.toString().trim() ?: 'cc'
	} catch (Exception ignored) {
		return 'cc'
	}
}

// 产物按 src/main/c/build/<target>/ 分目录放置，processClientResources 再映射进 JAR 的
// /native/<os>/<arch>/ 路径（见 Xsm.loadNativeLibrary）。
def nativeOutDir(def cdir, String rel) {
	return "${cdir.absolutePath}/${rel}"
}

def hostNativeOutputDir(def cdir) {
	if (Os.isFamily(Os.FAMILY_MAC)) {
		return nativeOutDir(cdir, 'build/macos')
	}
	if (Os.isFamily(Os.FAMILY_WINDOWS)) {
		return nativeOutDir(cdir, 'build-mingw/x86_64')
	}
	def arch = System.getProperty('os.arch', '').toLowerCase()
	def sub = (arch.contains('aarch64') || arch.contains('arm64')) ? 'linux-aarch64' : 'linux-x86_64'
	return nativeOutDir(cdir, "build/${sub}")
}

def androidNdk() {
	def ndk = project.findProperty('ndkPath')
	if (ndk) {
		return file(ndk.toString()).absolutePath
	}
	def env = System.getenv('ANDROID_NDK') ?: System.getenv('ANDROID_NDK_HOME')
	if (env) {
		return env
	}
	throw new RuntimeException(
		'Android NDK not found: pass -PndkPath=<ndk-dir> or set ANDROID_NDK_HOME')
}

def runCmake(def cdir, String bdir, List<String> args) {
	// Gradle 插桩了 ProcessBuilder：显式转成 String[]（并强制 GString→String），
	// 否则 Object[]→String[] 的 arraycopy 会在内插元素上抛 ArrayStoreException。
	def cfg = new ProcessBuilder(args as String[])
		.directory(cdir).inheritIO().start()
	if (cfg.waitFor() != 0) {
		throw new RuntimeException("cmake configure failed: ${args}")
	}
	def bld = new ProcessBuilder(
		'cmake', '--build', bdir, '--config', 'Release',
		'--target', 'xsmcore')
		.directory(cdir).inheritIO().start()
	if (bld.waitFor() != 0) {
		throw new RuntimeException('cmake build failed')
	}
}

task compileNative {
	description 'Compile the native shared library via CMake (host platform).'
	onlyIf { skipNative != 'true' }
	doLast {
		def cc = System.getenv('CC') ?: defaultCCompiler()
		def cdir = file('src/main/c')
		def outDir = hostNativeOutputDir(cdir)
		def args = ['cmake', '-S', '.', '-B', 'build',
			'-DCMAKE_BUILD_TYPE=Release',
			"-DCMAKE_C_COMPILER=${cc}",
			"-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${outDir}",
			"-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${outDir}"]
		if (Os.isFamily(Os.FAMILY_MAC)) {
			// macOS 用 universal dylib：arm64 + x86_64 两个 slice 一个文件。
			args.add('-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64')
		}
		runCmake(cdir, 'build', args)
	}
}

task compileNativeLinuxArm {
	description 'Cross-compile libxsmcore.so for Linux aarch64 (glibc) via aarch64-linux-gnu-gcc.'
	onlyIf { skipNative != 'true' }
	doLast {
		def cdir = file('src/main/c')
		runCmake(cdir, 'build-linux-arm', ['cmake', '-S', '.', '-B', 'build-linux-arm',
			'-DCMAKE_BUILD_TYPE=Release',
			'-DCMAKE_TOOLCHAIN_FILE=linux-arm-toolchain.cmake',
			"-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${nativeOutDir(cdir, 'build/linux-aarch64')}",
			"-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${nativeOutDir(cdir, 'build/linux-aarch64')}"])
	}
}

task compileNativeAndroid {
	description 'Cross-compile libxsmcore.so for Android (bionic) via the NDK: arm64-v8a + x86_64.'
	onlyIf { skipNative != 'true' }
	doLast {
		def cdir = file('src/main/c')
		def toolchain = "${androidNdk()}/build/cmake/android.toolchain.cmake"
		[['arm64-v8a', 'build-android-arm64', 'build/android-arm64'],
		 ['x86_64', 'build-android-x86_64', 'build/android-x86_64']].each { abi, bdir, rel ->
			def outDir = nativeOutDir(cdir, rel)
			runCmake(cdir, bdir, ['cmake', '-S', '.', '-B', bdir,
				'-DCMAKE_BUILD_TYPE=Release',
				"-DCMAKE_TOOLCHAIN_FILE=${toolchain}",
				"-DANDROID_ABI=${abi}",
				'-DANDROID_PLATFORM=android-24',
				'-DANDROID_STL=c++_static',
				"-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${outDir}",
				"-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${outDir}"])
		}
	}
}

task generateNativeBindings(type: Exec) {
	description 'Run jextract on src/main/c/xsm/apis/all.h → XsmNative.java FFM bindings.'
	dependsOn downloadJextract
	workingDir projectDir
	def includeArgs = file('src/main/c/includes.txt').readLines()
		.collectMany { it.split(/\s+/) as List }
	commandLine([jextractBinary,
		'--output', 'src/client/java',
		'--target-package', 'bid.yuanlu.seedmap4xaero.client.nativeapi',
		'--header-class-name', 'XsmNative',
		'--include-dir', 'src/main/c/xsm/apis',
	] + includeArgs + ['all.h'])
	doLast {
		// 修正平台相关 C_LONG/C_LONG_DOUBLE —— API 不用 long/long double，
		// 硬编码 LP64 变体（跨平台安全）。
		def shared = file('src/client/java/bid/yuanlu/seedmap4xaero/client/nativeapi/XsmNative$shared.java')
		if (shared.exists()) {
			def text = shared.text
			.replace('(ValueLayout.OfLong) Linker.nativeLinker().canonicalLayouts().get("long")',
					 'ValueLayout.JAVA_LONG')
			.replace('(ValueLayout.OfDouble) Linker.nativeLinker().canonicalLayouts().get("double")',
					 'ValueLayout.JAVA_DOUBLE')
			shared.text = text
		}
	}
}

tasks.named('compileClientJava') {
	dependsOn generateNativeBindings
}

task compileNativeWindows {
	description 'Cross-compile xsmcore.dll for Windows via MinGW.'
	onlyIf { skipNative != 'true' && skipNativeWindows != 'true' }
	doLast {
		def cdir = file('src/main/c')
		def outDir = nativeOutDir(cdir, 'build-mingw/x86_64')
		runCmake(cdir, 'build-mingw', ['cmake', '-S', '.', '-B', 'build-mingw',
			'-DCMAKE_BUILD_TYPE=Release',
			'-DCMAKE_TOOLCHAIN_FILE=mingw-toolchain.cmake',
			"-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${outDir}",
			"-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${outDir}"])
	}
}

processClientResources {
	if (skipNative != 'true') {
		dependsOn compileNative
		if (skipNativeWindows != 'true') {
			dependsOn compileNativeWindows
		}
	}
	// JAR 内 /native/<os>/<arch>/ 布局，与 Xsm.loadNativeLibrary 对应：
	//   linux/    → libxsmcore.so (glibc, x86_64 / aarch64)
	//   android/  → libxsmcore.so (bionic/NDK, arm64 / x86_64)  —— FCL/Pojav 用
	//   macos/    → libxsmcore.dylib (universal, arm64+x86_64)
	//   windows/  → xsmcore.dll (x86_64)
	from('src/main/c/build/linux-x86_64') { into 'native/linux/x86_64' }
	from('src/main/c/build/linux-aarch64') { into 'native/linux/aarch64' }
	from('src/main/c/build/android-arm64') { into 'native/android/arm64' }
	from('src/main/c/build/android-x86_64') { into 'native/android/x86_64' }
	from('src/main/c/build/macos') { into 'native/macos/universal' }
	if (skipNativeWindows != 'true') {
		from('src/main/c/build-mingw/x86_64') { into 'native/windows/x86_64' }
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "loader_version", project.loader_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"loader_version": project.loader_version
	}
}

clean {
	delete fileTree('src/client/java/bid/yuanlu/seedmap4xaero/client/nativeapi') {
		include 'XsmNative.java'
		exclude 'NativeLibLoader.java'
	}
	delete 'src/main/c/build'
	delete 'src/main/c/build-mingw'
	delete 'src/main/c/build-linux-arm'
	delete 'src/main/c/build-android-arm64'
	delete 'src/main/c/build-android-x86_64'
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
		it.options.release.set(targetJavaVersion)
	}
}

java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	if (JavaVersion.current() < javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
	withSourcesJar()
}

// sources jar 从 allSource 取原始资源，fabric.mod.json 是未展开的 ${version} 模板；
// 排除它，防止 sources jar 被当成 mod 加载导致 Loader 解析失败。
tasks.named('sourcesJar') {
	exclude 'fabric.mod.json'
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

publishMods {
	displayName = "Release ${project.mod_version}"
	file = jar.archiveFile
	type = STABLE
	modLoaders.add('fabric')
	changelog = providers.environmentVariable("CHANGELOG")
		.orElse("See the [commit history](https://github.com/MineYuanlu/SeedMapForXaero/commits/v${project.mod_version}) for details.")

	modrinth {
		projectId = "UoJSF4vW"
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		def matrix = new groovy.json.JsonSlurper().parse(file('versions.json'))
		matrix.versions.each { v -> minecraftVersions.add(v.id as String) }
	}
}
