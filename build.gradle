import org.apache.tools.ant.taskdefs.condition.Os

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_plugin_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://chocolateminecraft.com/maven" }
	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://maven.aliyun.com/repository/public" }
	mavenCentral()
    maven {
        name = 'xpple'
        url = 'https://maven.xpple.dev/maven2'
    }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"seed-map-for-xaero" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.findProperty('fabricApiVersion') ?: project.fabric_api_version}"

	def xaeroMapLine = project.findProperty('xaeroMapLine') ?: project.xaero_map_line
	def xaeroMapVersion = project.findProperty('xaeroMapVersion') ?: project.xaero_map_version
	compileOnly "xaero.map:xaeroworldmap-fabric-${xaeroMapLine}:${xaeroMapVersion}"
	runtimeOnly "xaero.map:xaeroworldmap-fabric-${xaeroMapLine}:${xaeroMapVersion}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
}

// ─── Native C build ─────────────────────────────────────────────────────────

def skipNative = project.findProperty('skipNativeBuild') ?: 'false'

def localPropsFile = file('gradle.local.properties')
if (localPropsFile.exists()) {
    def props = new Properties()
    localPropsFile.withInputStream { props.load(it) }
    props.each { k, v -> project.ext[k] = v }
}
def skipNativeWindows = project.findProperty('skipNativeWindows') ?: 'false'

ext.JEXTRACT_VERSION = '25'
ext.JEXTRACT_BUILD = '2'
ext.JEXTRACT_REV = '4'

def jextractUrl() {
    def osPart = Os.isFamily(Os.FAMILY_MAC) ?
        (System.getProperty("os.arch") == "aarch64" ? "macos-aarch64" : "macos-x64") :
        Os.isFamily(Os.FAMILY_WINDOWS) ? "windows-x64" : "linux-x64"
    return "https://download.java.net/java/early_access/jextract/${project.JEXTRACT_VERSION}/${project.JEXTRACT_BUILD}/" +
        "openjdk-${project.JEXTRACT_VERSION}-jextract+${project.JEXTRACT_BUILD}-${project.JEXTRACT_REV}_${osPart}_bin.tar.gz"
}

def defaultJextractDir = file("build/jextract/jextract-${project.JEXTRACT_VERSION}")
def defaultJextractBinary = file("${defaultJextractDir}/bin/jextract")
def jextractBinary = project.findProperty('jextractPath')
    ? file(project.findProperty('jextractPath').toString()).absolutePath
    : defaultJextractBinary.absolutePath

task downloadJextract() {
    description 'Download pre-built jextract binary from jdk.java.net.'
    onlyIf { !project.hasProperty('jextractPath') && !defaultJextractBinary.exists() }
    doLast {
        defaultJextractDir.parentFile.mkdirs()
        def tarball = file("${defaultJextractDir.parentFile}/jextract.tar.gz")
        def url = jextractUrl()
        logger.lifecycle("Downloading jextract from $url ...")
        new URL(url).withInputStream { i -> tarball.withOutputStream { it << i } }
        logger.lifecycle("Extracting jextract ...")
        new ProcessBuilder('tar', '-xzf', tarball.absolutePath, '-C', defaultJextractDir.parentFile.absolutePath)
            .inheritIO().start().waitFor()
        tarball.delete()
        new ProcessBuilder('chmod', '+x', defaultJextractBinary.absolutePath)
            .inheritIO().start().waitFor()
        logger.lifecycle("jextract ready at $defaultJextractBinary")
    }
}

def defaultCCompiler() {
    // Prefer clang if available (supports cubiomes C patterns on older GCC hosts)
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'which', 'clang-21'
            ignoreExitValue true
            standardOutput = out
        }
        return out.toString().trim() ?: 'cc'
    } catch (Exception ignored) {
        return 'cc'
    }
}

task compileNative {
    description 'Compile the native shared library via CMake.'
    onlyIf { skipNative != 'true' }
    doLast {
        def cc = System.getenv('CC') ?: defaultCCompiler()
        def cdir = file('src/main/c')

        def cfg = new ProcessBuilder(
            'cmake', '-S', '.', '-B', 'build',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_C_COMPILER=${cc}")
            .directory(cdir).inheritIO().start()
        if (cfg.waitFor() != 0) {
            throw new RuntimeException('cmake configure failed')
        }

        def bld = new ProcessBuilder(
            'cmake', '--build', 'build', '--config', 'Release',
            '--target', 'xsmcore')
            .directory(cdir).inheritIO().start()
        if (bld.waitFor() != 0) {
            throw new RuntimeException('cmake build failed')
        }
    }
}

task generateNativeBindings(type: Exec) {
    description 'Run jextract on src/main/c/xsm/apis/all.h → XsmNative.java FFM bindings.'
    dependsOn downloadJextract
    workingDir projectDir
    def includeArgs = file('src/main/c/includes.txt').readLines()
        .collectMany { it.split(/\s+/) as List }
    commandLine([jextractBinary,
        '--output', 'src/client/java',
        '--target-package', 'bid.yuanlu.seedmap4xaero.client.nativeapi',
        '--header-class-name', 'XsmNative',
        '--include-dir', 'src/main/c/xsm/apis',
    ] + includeArgs + ['all.h'])
    doLast {
        // Fix platform-dependent C_LONG / C_LONG_DOUBLE — our API never uses
        // long or long double, so hardcode the LP64 variant (safe cross-platform).
        def shared = file('src/client/java/bid/yuanlu/seedmap4xaero/client/nativeapi/XsmNative$shared.java')
        if (shared.exists()) {
            def text = shared.text
            .replace('(ValueLayout.OfLong) Linker.nativeLinker().canonicalLayouts().get("long")',
                     'ValueLayout.JAVA_LONG')
            .replace('(ValueLayout.OfDouble) Linker.nativeLinker().canonicalLayouts().get("double")',
                     'ValueLayout.JAVA_DOUBLE')
            shared.text = text
        }
    }
}

tasks.named('compileClientJava') {
    dependsOn generateNativeBindings
}

task compileNativeWindows {
    description 'Cross-compile xsmcore.dll for Windows via MinGW.'
    onlyIf { skipNative != 'true' && skipNativeWindows != 'true' }
    doLast {
        def cdir = file('src/main/c')
        def cfg = new ProcessBuilder(
            'cmake', '-S', '.', '-B', 'build-mingw',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_TOOLCHAIN_FILE=mingw-toolchain.cmake')
            .directory(cdir).inheritIO().start()
        if (cfg.waitFor() != 0) {
            throw new RuntimeException('cmake MinGW configure failed')
        }
        def bld = new ProcessBuilder(
            'cmake', '--build', 'build-mingw', '--config', 'Release',
            '--target', 'xsmcore')
            .directory(cdir).inheritIO().start()
        if (bld.waitFor() != 0) {
            throw new RuntimeException('cmake MinGW build failed')
        }
    }
}

processClientResources {
    if (skipNative != 'true') {
        dependsOn compileNative
        if (skipNativeWindows != 'true') {
            dependsOn compileNativeWindows
        }
    }
    from('src/main/c/build') {
        include 'libxsmcore.so'
        include 'libxsmcore.dylib'
    }
    if (skipNativeWindows != 'true') {
        from('src/main/c/build-mingw') {
            include 'xsmcore.dll'
        }
    }
}

processResources {
    inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

clean {
    delete fileTree('src/client/java/bid/yuanlu/seedmap4xaero/client/nativeapi') {
        include 'XsmNative.java'
        exclude 'NativeLibLoader.java'
    }
    delete 'src/main/c/build'
    delete 'src/main/c/build-mingw'
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
		it.options.release.set(targetJavaVersion)
	}
}

java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	if (JavaVersion.current() < javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

publishMods {
	displayName = "Release ${project.mod_version}"
	file = jar.archiveFile
	type = STABLE
	modLoaders.add('fabric')
	changelog = providers.environmentVariable("CHANGELOG")
		.orElse("See the [commit history](https://github.com/MineYuanlu/SeedMapForXaero/commits/v${project.mod_version}) for details.")

	modrinth {
		projectId = "UoJSF4vW"
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		minecraftVersions.add("${project.minecraft_version}")
	}
}
