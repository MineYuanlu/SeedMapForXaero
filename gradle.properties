# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G -Xms4G
org.gradle.parallel=true

downloadJavadoc=true
downloadSources=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# legacy 分支: 最后一个混淆线 1.21.11（Java 21），loom 用 remap 变体 + Mojang 官方映射
minecraft_version=1.21.11
# loader_version 同时是 dev runtime 依赖与 fabric.mod.json 的最低要求。
# 0.17.3 = Fabric API 0.141.6+1.21.11 的硬下限（ASM 9.9 / Mixin 0.8.7，支持 JAVA_21）。
loader_version=0.17.3
loom_version=1.17.21

# Mod Properties
mod_version=0.7.1-mc1.21.11
maven_group=bid.yuanlu.seedmap4xaero
archives_base_name=seed-map-for-xaero

# Dependencies
# 以下 key 与 CI -P 覆盖同名（见 matrix-test.yml / doc/testing.md）
# fabricApiVersion: 可按矩阵覆盖 -PfabricApiVersion
fabricApiVersion=0.141.6+1.21.11
# xaeroMapLine: Xaero 工件线的 MC 后缀（如 1.21.11），可按矩阵覆盖 -PxaeroMapLine
xaeroMapLine=1.21.11
# xaeroMapVersion: 可按矩阵覆盖 -PxaeroMapVersion（选该线 maven 最老版本，符号为全集子集）
xaeroMapVersion=1.40.4
# xaeroMinimapVersion: 仅 dev runtime 使用 (waypoint 转换测试需要)。
# CI 矩阵按 MC 行覆盖为 versions.json 里 xaeroMinimap (该线最新 release)。
xaeroMinimapVersion=25.3.5
xaeroLibVersion=1.1.17
mod_publish_plugin_version=1.1.0