# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G -Xms4G
org.gradle.parallel=true

downloadJavadoc=true
downloadSources=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# ── 多版本构建（stonecutter）─────────────────────────────────────────────────
# 本文件只放全节点共享参数；MC/loader 线别在 versions/<节点>/gradle.properties，
# 依赖版本（fabricApi/Xaero/minimap）真值源 = 根 versions.json（-P 可覆盖）。
# ⚠ -P 属性是 build 全局的：一次调用会配置全部 stonecutter 节点，全局 key 的
# 覆盖会波及所有节点；按节点覆盖用节点作用域 key（如 xaeroMapVersion.<节点名>）。

# loom 版本：loom-back-compat 按 MC 线自动选择插件 ID（fabric-loom / fabric-loom-remap）
loomx.loom_version=1.17.21

# Mod Properties
# mod_version 不在此定义：版本号由 build.gradle 从 git tag 状态确定性计算，
# 追加 "+mc<artifactVersion>" 后缀区分双 artifact（versions.json 行字段）；-Pmod_version=... 可手动覆盖
maven_group=bid.yuanlu.seedmap4xaero
archives_base_name=seed-map-for-xaero
mod_publish_plugin_version=1.1.0

# Stonecutter Groovy 中央脚本已知约束确认（消除每次构建的警告）
dev.kikugie.stonecutter.hard_mode=true
