# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G -Xms4G
org.gradle.parallel=true

downloadJavadoc=true
downloadSources=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=0.1.4
maven_group=bid.yuanlu.seedmap4xaero
archives_base_name=seed-map-for-xaero

# Dependencies
# 以下 key 与 CI -P 覆盖同名（见 matrix-test.yml / doc/testing.md）
# fabricApiVersion: 可按矩阵覆盖 -PfabricApiVersion
fabricApiVersion=0.153.0+26.1.2
# xaeroMapLine: Xaero 工件线的 MC 后缀（如 26.1.2、26.2），可按矩阵覆盖 -PxaeroMapLine
xaeroMapLine=26.1.2
# xaeroMapVersion: 可按矩阵覆盖 -PxaeroMapVersion
xaeroMapVersion=1.41.0
xaeroLibVersion=1.1.17
mod_publish_plugin_version=1.1.0