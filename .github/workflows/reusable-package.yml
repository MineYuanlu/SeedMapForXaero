name: reusable-package

# 可复用 workflow：汇总 reusable-native-build 产出的全平台 native 进一个 universal JAR。
# 流程：下载 5 个 native artifact → 放到 src/main/c/build*/ 对应目录 →
# gradle 以 -PskipNativeBuild 打包（processClientResources 映射进 JAR 的 /native/<os>/<arch>/）→
# 可选 C 单测 + 内置校验（断言 JAR 内含全平台 6 个 native 文件）→ 上传 artifact。
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch / tag / SHA) to check out. Empty = caller ref.'
        required: false
        default: ''
        type: string
      artifact-name:
        description: '上传 artifact 名。'
        required: false
        default: 'seed-map-for-xaero'
        type: string
      run-ctests:
        description: '打包前是否跑 C 单测。'
        required: false
        default: true
        type: boolean
      verify-natives:
        description: '打包后逐项断言 JAR 内含全平台 6 个 native 文件。'
        required: false
        default: true
        type: boolean

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: Download native libs
        uses: actions/download-artifact@v8
        with:
          path: prebuilt/
      - name: Place native libs
        run: |
          mkdir -p src/main/c/build/linux-x86_64 src/main/c/build/linux-aarch64 \
                   src/main/c/build/android-arm64 src/main/c/build/android-x86_64 \
                   src/main/c/build/macos src/main/c/build-mingw/x86_64
          cp prebuilt/native-linux-x86_64/libxsmcore.so  src/main/c/build/linux-x86_64/
          cp prebuilt/native-linux-aarch64/libxsmcore.so src/main/c/build/linux-aarch64/
          cp prebuilt/native-android-arm64/libxsmcore.so src/main/c/build/android-arm64/
          cp prebuilt/native-android-x86_64/libxsmcore.so src/main/c/build/android-x86_64/
          cp prebuilt/native-macos/libxsmcore.dylib src/main/c/build/macos/
          cp prebuilt/native-windows/xsmcore.dll src/main/c/build-mingw/x86_64/
      - name: Run C unit tests
        if: inputs.run-ctests
        run: |
          cmake -S src/main/c -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --target xsmtest
          ./build-test/xsmtest
      - name: Build JAR (skip native, use prebuilt libs)
        run: |
          chmod +x ./gradlew
          ./gradlew build -PskipNativeBuild -x compileNative -x compileNativeWindows
      - name: Verify JAR bundles all platform natives
        if: inputs.verify-natives
        run: |
          JAR=$(find build/libs -name 'seed-map-for-xaero-*.jar' ! -name '*-sources.jar' | head -1)
          test -n "$JAR" || {
            echo "::error::no jar found in build/libs"
            exit 1
          }
          for lib in \
            native/linux/x86_64/libxsmcore.so \
            native/linux/aarch64/libxsmcore.so \
            native/android/arm64/libxsmcore.so \
            native/android/x86_64/libxsmcore.so \
            native/macos/universal/libxsmcore.dylib \
            native/windows/x86_64/xsmcore.dll; do
            unzip -l "$JAR" | grep -q "$lib" || {
              echo "::error::missing $lib in $JAR"
              exit 1
            }
          done
          echo "JAR bundles all platforms: $JAR"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: build/libs/
