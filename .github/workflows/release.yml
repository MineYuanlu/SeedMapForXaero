name: release

# 手动发布：bump 版本并打 tag → 编译全平台 native（reusable-native-build）→
# 汇总 JAR、生成 changelog、发布 Modrinth + GitHub Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    name: Bump version & tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump version in gradle.properties
        id: bump
        run: |
          CURRENT=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ github.event.inputs.version }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          sed -i "s/^mod_version=.*/mod_version=${NEW_VERSION}/" gradle.properties
          git add gradle.properties
          git commit -m "chore(release): v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin master
          git push origin "v${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

  natives:
    needs: bump
    uses: ./.github/workflows/reusable-native-build.yml
    with:
      ref: v${{ needs.bump.outputs.version }}
    secrets: inherit

  release:
    name: Package, release & publish
    needs:
      - bump
      - natives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.bump.outputs.version }}
          submodules: recursive
          # 完整历史：changelog 的 git describe 需要拿到上一个 tag。
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: Download native libs
        uses: actions/download-artifact@v8
        with:
          path: prebuilt/
      - name: Place native libs
        run: |
          mkdir -p src/main/c/build/linux-x86_64 src/main/c/build/linux-aarch64 \
                   src/main/c/build/android-arm64 src/main/c/build/android-x86_64 \
                   src/main/c/build/macos src/main/c/build-mingw/x86_64
          cp prebuilt/native-linux-x86_64/libxsmcore.so  src/main/c/build/linux-x86_64/
          cp prebuilt/native-linux-aarch64/libxsmcore.so src/main/c/build/linux-aarch64/
          cp prebuilt/native-android-arm64/libxsmcore.so src/main/c/build/android-arm64/
          cp prebuilt/native-android-x86_64/libxsmcore.so src/main/c/build/android-x86_64/
          cp prebuilt/native-macos/libxsmcore.dylib src/main/c/build/macos/
          cp prebuilt/native-windows/xsmcore.dll src/main/c/build-mingw/x86_64/
      - name: Run C unit tests
        run: |
          cmake -S src/main/c -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --target xsmtest
          ./build-test/xsmtest
      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
          else
            LOG=$(git log --oneline --no-decorate -10)
          fi
          {
            echo 'CHANGELOG<<EOF_M'
            echo "## What's Changed"
            echo "$LOG"
            echo ""
            echo "**Full Changelog**: https://github.com/MineYuanlu/SeedMapForXaero/commits/v${{ needs.bump.outputs.version }}"
            echo 'EOF_M'
          } >> "$GITHUB_ENV"
      - name: Publish to Modrinth
        run: ./gradlew publishMods -PskipNativeBuild -x compileNative -x compileNativeWindows -PxaeroMapLine=26.1.2 -PxaeroMapVersion=1.40.14
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CHANGELOG: ${{ env.CHANGELOG }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          name: v${{ needs.bump.outputs.version }}
          generate_release_notes: true
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
