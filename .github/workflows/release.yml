name: release

# 手动发布：bump 版本并打 tag → 编译全平台 native（reusable-native-build）→
# 汇总 JAR、生成 changelog、发布 Modrinth + GitHub Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: '发布说明（Markdown，可选）。为空时回退自动生成的 git log changelog。'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  bump:
    name: Determine version & tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 完整历史 + tags：版本号按"可达 tag + 提交数"算法计算（见 build.gradle 顶部注释）
          fetch-depth: 0
          fetch-tags: true
      - name: Bump version & push tag
        id: bump
        run: |
          LAST=$(git tag --list --merged HEAD --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          case "${{ github.event.inputs.version }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          # tag-only：不产生 bump commit，避开 master 分支保护；tag 已存在则在此报错
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

  natives:
    needs: bump
    uses: ./.github/workflows/reusable-native-build.yml
    with:
      ref: v${{ needs.bump.outputs.version }}
    secrets: inherit

  release:
    name: Package, release & publish
    needs:
      - bump
      - natives
    runs-on: ubuntu-24.04
    # contents: 创建 GitHub Release；id-token/attestations: SLSA 构建来源证明
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.bump.outputs.version }}
          submodules: recursive
          # 完整历史 + tags：changelog 需要，版本算法也需要（HEAD==tag 且干净 → 纯 "X.Y.Z"）
          fetch-depth: 0
          fetch-tags: true
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: Download native libs
        uses: actions/download-artifact@v8
        with:
          path: build/prebuilt/
      - name: Place native libs
        run: |
          mkdir -p src/main/c/build/linux-x86_64 src/main/c/build/linux-aarch64 \
                   src/main/c/build/android-arm64 src/main/c/build/android-x86_64 \
                   src/main/c/build/macos src/main/c/build-mingw/x86_64
          cp build/prebuilt/native-linux-x86_64/libxsmcore.so  src/main/c/build/linux-x86_64/
          cp build/prebuilt/native-linux-aarch64/libxsmcore.so src/main/c/build/linux-aarch64/
          cp build/prebuilt/native-android-arm64/libxsmcore.so src/main/c/build/android-arm64/
          cp build/prebuilt/native-android-x86_64/libxsmcore.so src/main/c/build/android-x86_64/
          cp build/prebuilt/native-macos/libxsmcore.dylib src/main/c/build/macos/
          cp build/prebuilt/native-windows/xsmcore.dll src/main/c/build-mingw/x86_64/
      - name: Run C unit tests
        run: |
          cmake -S src/main/c -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --target xsmtest
          ./build-test/xsmtest
      - name: Generate changelog
        run: |
          if [ -n "$RELEASE_NOTES" ]; then
            # 手动提供的发布说明优先：Modrinth changelog 与 GitHub Release 正文统一用这份
            { echo 'CHANGELOG<<EOF_M'; echo "$RELEASE_NOTES"; echo 'EOF_M'; } >> "$GITHUB_ENV"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              LOG=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
            else
              LOG=$(git log --oneline --no-decorate -10)
            fi
            {
              echo 'CHANGELOG<<EOF_M'
              echo "## What's Changed"
              echo "$LOG"
              echo ""
              echo "**Full Changelog**: https://github.com/MineYuanlu/SeedMapForXaero/commits/v${{ needs.bump.outputs.version }}"
              echo 'EOF_M'
            } >> "$GITHUB_ENV"
          fi
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
      - name: Verify computed version is exact X.Y.Z
        run: |
          EXPECTED="${{ needs.bump.outputs.version }}"
          COMPUTED=$(./gradlew -q --console=plain properties | grep -E '^version: ' | cut -d' ' -f2)
          echo "computed=$COMPUTED expected=$EXPECTED"
          # 必须精确 X.Y.Z：带后缀说明工作区 dirty 或 tag 没取到（tag-only 发布的硬性前提）
          if ! [[ "$COMPUTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::computed version '$COMPUTED' is not exact X.Y.Z (dirty worktree or missing tag?)"
            exit 1
          fi
          if [ "$COMPUTED" != "$EXPECTED" ]; then
            echo "::error::computed version '$COMPUTED' != expected '$EXPECTED'"
            exit 1
          fi
      # 显式构建 universal JAR（publishMods 复用同一产物；-P 参数必须与 publishMods 一致）
      - name: Build universal JAR
        run: ./gradlew jar -PskipNativeBuild -x compileNative -x compileNativeWindows -PxaeroMapLine=26.1.2 -PxaeroMapVersion=1.40.14
      - name: Generate SHA256SUMS
        run: |
          JAR=$(find build/libs -name 'seed-map-for-xaero-*.jar' ! -name '*-sources.jar' -printf '%f\n' | head -1)
          test -n "$JAR" || { echo "::error::no jar found in build/libs"; exit 1; }
          (cd build/libs && sha256sum "$JAR" > SHA256SUMS)
          cat build/libs/SHA256SUMS
          echo "JAR_NAME=$JAR" >> "$GITHUB_ENV"
      # SLSA 构建来源证明：密码学绑定 JAR ↔ repo ↔ commit ↔ workflow run（doc/build-verification.md）
      # 验证: gh attestation verify <jar> --repo MineYuanlu/SeedMapForXaero
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4 # v4.2.2 (4d101475d8b20a2381f78447822ac1eab6504dd8)
        with:
          subject-path: |
            build/libs/${{ env.JAR_NAME }}
            build/libs/SHA256SUMS
      - name: Publish to Modrinth
        run: ./gradlew publishMods -PskipNativeBuild -x compileNative -x compileNativeWindows -PxaeroMapLine=26.1.2 -PxaeroMapVersion=1.40.14
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CHANGELOG: ${{ env.CHANGELOG }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          name: v${{ needs.bump.outputs.version }}
          body: ${{ env.CHANGELOG }}
          # 未提供 release_notes 时回退 GitHub 自动生成的 notes
          generate_release_notes: ${{ inputs.release_notes == '' }}
          files: |
            build/libs/${{ env.JAR_NAME }}
            build/libs/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
