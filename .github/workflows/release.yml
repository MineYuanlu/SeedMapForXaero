name: 🚀 Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    name: Bump version & tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump version in gradle.properties
        id: bump
        run: |
          CURRENT=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ github.event.inputs.version }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          sed -i "s/^mod_version=.*/mod_version=${NEW_VERSION}/" gradle.properties
          git add gradle.properties
          git commit -m "chore(release): v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin master
          git push origin "v${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

  # 产物按 src/main/c/build/<target>/ 分目录，release 汇总进 JAR 的 /native/<os>/<arch>/。
  compile-native-linux:
    name: Compile native .so (x86_64)
    needs: bump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.bump.outputs.version }}
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: Build native library
        working-directory: src/main/c
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$PWD/build/linux-x86_64 \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$PWD/build/linux-x86_64
          cmake --build build --target xsmcore
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-x86_64
          path: src/main/c/build/linux-x86_64/libxsmcore.so

  compile-native-linux-arm:
    name: Compile native .so (aarch64)
    needs: bump
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.bump.outputs.version }}
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: C unit tests (native aarch64)
        working-directory: src/main/c
        run: |
          cmake -S . -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --target xsmtest
          ./build-test/xsmtest
      - name: Build native library
        working-directory: src/main/c
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$PWD/build/linux-aarch64 \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$PWD/build/linux-aarch64
          cmake --build build --target xsmcore
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-aarch64
          path: src/main/c/build/linux-aarch64/libxsmcore.so

  compile-native-android:
    name: Compile native .so (Android bionic)
    needs: bump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.bump.outputs.version }}
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake unzip
      - name: Download Android NDK
        run: |
          curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp
          echo "ANDROID_NDK=/tmp/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Build arm64-v8a (bionic)
        working-directory: src/main/c
        run: |
          cmake -S . -B build-android-arm64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$PWD/build/android-arm64 \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$PWD/build/android-arm64
          cmake --build build-android-arm64 --target xsmcore
      - name: Build x86_64 (bionic)
        working-directory: src/main/c
        run: |
          cmake -S . -B build-android-x86_64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$PWD/build/android-x86_64 \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$PWD/build/android-x86_64
          cmake --build build-android-x86_64 --target xsmcore
      - name: Verify ELF (bionic, no versioned SONAME)
        run: |
          for f in src/main/c/build/android-arm64/libxsmcore.so src/main/c/build/android-x86_64/libxsmcore.so; do
            echo "== $f =="
            file "$f"
            if readelf -d "$f" | grep NEEDED | grep -qE '\.so\.[0-9]+'; then
              echo "::error::glibc-style versioned SONAME found in $f"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: native-android-arm64
          path: src/main/c/build/android-arm64/libxsmcore.so
      - uses: actions/upload-artifact@v7
        with:
          name: native-android-x86_64
          path: src/main/c/build/android-x86_64/libxsmcore.so

  compile-native-macos:
    name: Compile native .dylib (universal)
    needs: bump
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.bump.outputs.version }}
          submodules: recursive
      - name: Install cmake
        run: brew install cmake
      - name: Build native library (universal dylib)
        working-directory: src/main/c
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$PWD/build/macos \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$PWD/build/macos
          cmake --build build --target xsmcore
      - name: Verify universal dylib
        run: lipo -info src/main/c/build/macos/libxsmcore.dylib
      - uses: actions/upload-artifact@v7
        with:
          name: native-macos
          path: src/main/c/build/macos/libxsmcore.dylib

  compile-native-windows:
    name: Compile native .dll
    needs: bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.bump.outputs.version }}
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Build native library
        shell: msys2 {0}
        working-directory: src/main/c
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$PWD/build-mingw/x86_64 \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$PWD/build-mingw/x86_64
          cmake --build build --target xsmcore --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: native-windows
          path: src/main/c/build-mingw/x86_64/xsmcore.dll

  release:
    name: Build, Release & Publish
    needs:
      - bump
      - compile-native-linux
      - compile-native-linux-arm
      - compile-native-android
      - compile-native-macos
      - compile-native-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.bump.outputs.version }}
          submodules: recursive
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: Download native libs
        uses: actions/download-artifact@v8
        with:
          path: prebuilt/
      - name: Place native libs
        run: |
          mkdir -p src/main/c/build/linux-x86_64 src/main/c/build/linux-aarch64 \
                   src/main/c/build/android-arm64 src/main/c/build/android-x86_64 \
                   src/main/c/build/macos src/main/c/build-mingw/x86_64
          cp prebuilt/native-linux-x86_64/libxsmcore.so  src/main/c/build/linux-x86_64/
          cp prebuilt/native-linux-aarch64/libxsmcore.so src/main/c/build/linux-aarch64/
          cp prebuilt/native-android-arm64/libxsmcore.so src/main/c/build/android-arm64/
          cp prebuilt/native-android-x86_64/libxsmcore.so src/main/c/build/android-x86_64/
          cp prebuilt/native-macos/libxsmcore.dylib src/main/c/build/macos/
          cp prebuilt/native-windows/xsmcore.dll src/main/c/build-mingw/x86_64/
      - name: Run C unit tests
        run: |
          cmake -S src/main/c -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --target xsmtest
          ./build-test/xsmtest
      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
          else
            LOG=$(git log --oneline --no-decorate -10)
          fi
          {
            echo 'CHANGELOG<<EOF_M'
            echo "## What's Changed"
            echo "$LOG"
            echo ""
            echo "**Full Changelog**: https://github.com/MineYuanlu/SeedMapForXaero/commits/v${{ needs.bump.outputs.version }}"
            echo 'EOF_M'
          } >> "$GITHUB_ENV"
      - name: Publish to Modrinth
        run: ./gradlew publishMods -PskipNativeBuild -x compileNative -x compileNativeWindows -PxaeroMapLine=26.1.2 -PxaeroMapVersion=1.40.14
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CHANGELOG: ${{ env.CHANGELOG }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          name: v${{ needs.bump.outputs.version }}
          generate_release_notes: true
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
