name: build

# 全面门禁：编译全平台 native（reusable-native-build）+ 汇总成 universal JAR（reusable-package）。
# 产物等同 release 产物（内含全平台 6 个 native 文件），自动产出。
# 单人开发流程：dev/xxx → PR → master → 手动发版。
# PR → master 是合入前的完整验证门禁（与 matrix-test.yml 并行跑）；
# tag 触发用于留档 release 引用构建。feature 分支推送/非 master PR 的快速检查在 pr-check.yml。
# 手动触发支持 inputs.ref 指定任意分支/tag/SHA（默认 = 触发时选的 ref），
# 供对任意 feature 分支/提交跑全量门禁（matrix-test.yml 同）。
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  # 手动触发供 refresh-toolchain 在工具链候选分支上拉起完整门禁（gh workflow run --ref）
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch / tag / SHA) to build. Empty = dispatch ref.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# 同一 PR/push 的新 commit 取消上一个还在跑的 run
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  natives:
    uses: ./.github/workflows/reusable-native-build.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
    secrets: inherit

  package:
    needs: natives
    uses: ./.github/workflows/reusable-package.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      artifact-name: seed-map-for-xaero
      run-ctests: true
      verify-natives: true
    secrets: inherit
