name: build

# 全面门禁：编译全平台 native（reusable-native-build）+ 汇总成 universal JAR（reusable-package）。
# 产物等同 release 产物（内含全平台 6 个 native 文件），自动产出。
# 单人开发流程：dev/xxx → develop → master → 手动发版。
# develop 是合入 master 前的完整验证门禁，因此 develop 与 master 都跑全量构建；
# tag 触发用于留档 release 引用构建。feature 分支/PR 的快速检查在 pr-check.yml。
on:
  push:
    branches: [master, develop]
    tags: ['v*']

permissions:
  contents: read

jobs:
  natives:
    uses: ./.github/workflows/reusable-native-build.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit

  package:
    needs: natives
    uses: ./.github/workflows/reusable-package.yml
    with:
      ref: ${{ github.ref }}
      artifact-name: seed-map-for-xaero
      run-ctests: true
      verify-natives: true
    secrets: inherit
