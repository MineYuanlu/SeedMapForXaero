name: matrix-test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Resolve: expand versions.json into the strategy matrices ──
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
      matrix-e2e: ${{ steps.emit-e2e.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Check versions.json freshness (advisory, never blocks)
        run: |
          python3 tools/resolve_versions.py check || \
            echo "::warning::versions.json is stale — run the refresh workflow"
      - name: Emit matrix JSON (8 combos, 4 MC x oldest/newest Xaero)
        id: emit
        run: |
          python3 tools/resolve_versions.py matrix --tag all > /tmp/matrix.json
          {
            echo "matrix<<EOF"
            cat /tmp/matrix.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Emit E2E matrix JSON (newest Xaero only)
        id: emit-e2e
        run: |
          python3 tools/resolve_versions.py matrix --tag newest > /tmp/matrix-e2e.json
          {
            echo "matrix<<EOF"
            cat /tmp/matrix-e2e.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── Test: 8 combos (4 MC × oldest/newest Xaero) ──
  test:
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: C unit tests (xsmtest)
        run: |
          cmake -S src/main/c -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --target xsmtest
          XSM_TEST_MC_VERSION=${{ matrix.mc }} ./build-test/xsmtest
      - name: Build JAR + JUnit tests
        run: |
          chmod +x ./gradlew
          ./gradlew build -x compileNativeWindows \
            -Pminecraft_version=${{ matrix.mc }} \
            -PxaeroMapLine=${{ matrix.xaeroLine }} \
            -PxaeroMapVersion=${{ matrix.xaeroVersion }} \
            -PfabricApiVersion=${{ matrix.fabricApi }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.mc }}-${{ matrix.xaeroVersion }}
          path: |
            build/reports/tests/test
            build/test-results/test

  # ── Client E2E gametest（生产运行，headless）──────────────────────────────
  # 对照 Fabric 官方 CI（fabric-api/.github/workflows/build.yml client_test job）：
  # 无显示 ubuntu + xvfb + 上传截图。验证真实启动 MC 客户端后种子地图渲染链路。
  # 矩阵取 newest Xaero 的 4 个 MC 版本组合（由 resolve 的 matrix-e2e 输出）——
  # 8 组合编译矩阵只验证编译，mixin 的运行时应用只有真实启动的 E2E 能验证（各版本
  # fabric-client-gametest API 差异、MC/Xaero 目标方法名差异都会在这里暴露）。
  client-test:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix-e2e) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies (cmake/gcc/xvfb)
        run: sudo apt-get update && sudo apt-get install -y cmake gcc xvfb
      - name: Run client gametest (production, headless via xvfb)
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          # -PskipNativeWindows=true：CI ubuntu 无 MinGW，runProductionClientGameTest
          # 的任务链会带 processClientResources → compileNativeWindows 交叉编译失败。
          ./gradlew runProductionClientGameTest -PskipNativeWindows=true \
            -Pminecraft_version=${{ matrix.mc }} \
            -PxaeroMapLine=${{ matrix.xaeroLine }} \
            -PxaeroMapVersion=${{ matrix.xaeroVersion }} \
            -PfabricApiVersion=${{ matrix.fabricApi }} \
            --stacktrace > gametest.log 2>&1
          # 断言全部通过才算成功；挂起由 timeout-minutes 兜底 kill
          grep -q "seed-map E2E assertions passed" gametest.log || {
            echo "::error::client gametest assertions did not pass (mc=${{ matrix.mc }}, xaero=${{ matrix.xaeroVersion }})"
            exit 1
          }
      - name: Upload gametest log (diagnose hangs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-log-${{ matrix.mc }}
          path: gametest.log
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-screenshots-${{ matrix.mc }}
          path: run/screenshots
