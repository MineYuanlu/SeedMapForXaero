name: matrix-test

# 版本矩阵测试（节点 × 新旧 Xaero 编译 + JUnit + C 单测 + E2E 真实启动）。
# 触发：master 推送（最终确认）+ PR → master（合入门禁）+ 手动。
# 手动触发支持 inputs.ref 指定任意分支/tag/SHA（默认 = 触发时选的 ref），
# 供对任意 feature 分支/提交跑全量门禁（build.yml 同）。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch / tag / SHA) to test. Empty = dispatch ref.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# 同一 PR/push 的新 commit 取消上一个还在跑的 run
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Resolve: expand versions.json into the strategy matrices ──
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
      matrix-e2e: ${{ steps.emit-e2e.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      - name: Check versions.json freshness (advisory, never blocks)
        run: |
          python3 tools/resolve_versions.py check || \
            echo "::warning::versions.json is stale — run the refresh workflow"
      - name: Emit matrix JSON (per-node oldest/newest Xaero)
        id: emit
        run: |
          python3 tools/resolve_versions.py matrix --tag all > /tmp/matrix.json
          {
            echo "matrix<<EOF"
            cat /tmp/matrix.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Emit E2E matrix JSON (newest Xaero only)
        id: emit-e2e
        run: |
          python3 tools/resolve_versions.py matrix --tag newest > /tmp/matrix-e2e.json
          {
            echo "matrix<<EOF"
            cat /tmp/matrix-e2e.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── Test: 每节点 × oldest/newest Xaero，源码兼容预警 ──────────────────────
  # 目的：确保源码在全部 MC × Xaero 组合下可编译 + JUnit + C 单测通过。
  # stonecutter 节点 = MC 版本（:1.21.11 / :26.1.2 / ...），-P 只覆盖 Xaero 端点，
  # fabricApi/minimap 由 versions.json 行提供。
  # 这里产出的 jar 只是编译载体，不发布；发布产物见 build-universal。
  test:
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      # Gradle/stonecutter 需 JVM 25；legacy 的 21 只是 --release 编译目标（JDK25 javac 交叉编译）
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: C unit tests (xsmtest)
        run: |
          cmake -S src/main/c -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --target xsmtest
          XSM_TEST_MC_VERSION=${{ matrix.mc }} ./build-test/xsmtest
      - name: Compile + JUnit tests (source coverage, not published)
        run: |
          chmod +x ./gradlew
          # 节点作用域 key：-P 是 build 全局的，会配置全部 stonecutter 节点；
          # 全局 key 会让兄弟节点拿别人的 Xaero 端点解析自己的线而挂
          tools/gradle_retry.sh ./gradlew :${{ matrix.node }}:build -x compileNativeWindows \
            -PxaeroMapVersion.${{ matrix.node }}=${{ matrix.xaeroVersion }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.mc }}-${{ matrix.xaeroVersion }}
          path: |
            versions/${{ matrix.node }}/build/reports/tests/test
            versions/${{ matrix.node }}/build/test-results/test

  # ── 发布产物 jar：modern universal + legacy，供 E2E 复用 ─────────────────
  # 双 artifact 各自按本线最老 Xaero 编译（versions.json 行默认值即 xaeroOldest）：
  #   modern (26.1.2 节点): 引用符号是 26.x 全家族子集，单 jar 通吃 26.1–26.3
  #   legacy  (1.21.11 节点): mojmap 编译 → remapJar 到 intermediary
  build-universal:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: Build modern universal jar + legacy jar (oldest Xaero line)
        run: |
          chmod +x ./gradlew
          # CI ubuntu 无 MinGW → -PskipNativeWindows=true；jar 只需内含 Linux .so
          # 供 universal-e2e 使用（release 流程单独打全平台 native）。
          tools/gradle_retry.sh ./gradlew :26.1.2:modJar :1.21.11:modJar \
            -x compileNativeWindows \
            -PskipNativeWindows=true
      - name: Upload modern universal jar
        uses: actions/upload-artifact@v7
        with:
          name: universal-jar
          # 只传生产 jar：排除 -sources.jar，其 fabric.mod.json 是未展开的
          # ${version}/${loader_version} 模板，被 E2E 误载会导致 Loader 解析失败。
          path: |
            versions/26.1.2/build/libs/seed-map-for-xaero-*.jar
            !versions/26.1.2/build/libs/*-sources.jar
      - name: Upload legacy jar
        uses: actions/upload-artifact@v7
        with:
          name: legacy-jar
          path: |
            versions/1.21.11/build/libs/seed-map-for-xaero-*.jar
            !versions/1.21.11/build/libs/*-sources.jar

  # ── Universal client E2E gametest（生产运行，headless）────────────────────
  # 对照 Fabric 官方 CI（fabric-api/.github/workflows/build.yml client_test job）：
  # 无显示 ubuntu + xvfb + 上传截图。与旧 client-test 的区别：mod 本体不再按矩阵
  # 重新编译，而是复用 build-universal 产出的同一个 jar
  # （runProductionClientGameTestUniversal + -PuniversalJar）。因此验证的是
  # "发布的单 jar 在所有 MC × Xaero 上真实可用"，而非"该版本源码编译出的 jar 可用"。
  # 矩阵取 newest Xaero 的每 MC 一行组合（行数 = versions.json 节点数，由 resolve 的 matrix-e2e 输出）——
  # mixin 的运行时应用、MC/Xaero 目标方法名差异都在真实启动中暴露。
  universal-e2e:
    needs:
      - resolve
      - build-universal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # MC 26.3 换用 SDL3+renderpearl 渲染栈：其 GlDevice 探针窗口带
      # SDL_WINDOW_TRANSPARENT 且强制 sRGB framebuffer，Xvfb 的 GLX 匹配不到
      # depth-32 fbconfig → "Couldn't find matching GLX visual" → GL/Vulkan 双
      # backend 失败后客户端挂死直到超时。offscreen 驱动走 EGL 软渲染，完全
      # 绕开 X11/GLX。26.1/26.2 走 GLFW，不读 SDL_* 环境变量，对它们无副作用。
      SDL_VIDEODRIVER: offscreen
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix-e2e) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      # Gradle/stonecutter 需 JVM 25；legacy 的 21 只是 --release 编译目标（JDK25 javac 交叉编译）
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies (cmake/gcc/xvfb/egl)
        run: sudo apt-get update && sudo apt-get install -y cmake gcc xvfb libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri
      - name: Download release jar (modern universal / legacy)
        uses: actions/download-artifact@v8
        with:
          # artifact 家族由 versions.json 行的 artifact 字段决定
          name: ${{ matrix.artifact == 'legacy' && 'legacy-jar' || 'universal-jar' }}
          path: universal
      - name: Run client gametest (release jar, production, headless via xvfb)
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          # 只选生产 jar，排除 -sources.jar（其 fabric.mod.json 为未展开的 ${version} 模板），
          # 并断言所选 jar 内模板已展开，防止任何错误 jar 被误载。
          # 绝对路径：-PuniversalJar 的相对路径会按节点项目目录解析（build.gradle 按
          # 仓库根解析兜底，这里双保险），拼错目录会让 loader "Skipping missing mod path"
          UJAR="$PWD/$(find universal -name 'seed-map-for-xaero-*.jar' ! -name '*-sources.jar' | head -1)"
          test -n "$UJAR" || {
            echo "::error::no production jar found (mc=${{ matrix.mc }}, artifact=${{ matrix.artifact }})"
            exit 1
          }
          unzip -p "$UJAR" fabric.mod.json | grep -qF '${' && {
            echo "::error::jar still carries unexpanded template: $UJAR (mc=${{ matrix.mc }})"
            exit 1
          }
          # -PuniversalJar 让 mod 本体用预构建 jar（不重编译）；E2E 矩阵取 newest Xaero
          # （节点默认 = oldest，这里显式覆盖）；-PskipNativeWindows=true 规避 CI 无 MinGW。
          tools/gradle_retry.sh ./gradlew :${{ matrix.node }}:runProductionClientGameTestUniversal -PskipNativeWindows=true \
            -PuniversalJar="$UJAR" \
            -PxaeroMapVersion.${{ matrix.node }}=${{ matrix.xaeroVersion }} \
            --stacktrace > gametest.log 2>&1
          # 断言全部通过才算成功；挂起由 timeout-minutes 兜底 kill
          grep -q "seed-map E2E assertions passed" gametest.log || {
            echo "::error::client gametest assertions did not pass (mc=${{ matrix.mc }}, xaero=${{ matrix.xaeroVersion }})"
            exit 1
          }
      - name: Upload gametest log (diagnose hangs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-log-${{ matrix.mc }}
          path: gametest.log
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-screenshots-${{ matrix.mc }}
          path: run/screenshots

  # ── Gate: 固定名字的聚合检查（branch protection required check 用）──────────
  # test / universal-e2e 是动态矩阵，job 名含版本号（如 "test (26.1 / 1.41.0)"），
  # versions.json 增长后名字会变，不能作为 required check（失配会让 PR 永远卡
  # "Expected"）。required checks 只用稳定名：本 job + build.yml 的 natives/package。
  gate:
    needs: [resolve, test, build-universal, universal-e2e]
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - run: echo "matrix-test gate passed"
