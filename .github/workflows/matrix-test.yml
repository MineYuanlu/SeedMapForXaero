name: matrix-test

# 版本矩阵测试（8 组合编译 + JUnit + C 单测 + 4 路 E2E 真实启动）。
# 触发：develop / master 推送（全面门禁）+ 手动。feature 分支只跑 pr-check 快速检查。
on:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Resolve: expand versions.json into the strategy matrices ──
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
      matrix-e2e: ${{ steps.emit-e2e.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Check versions.json freshness (advisory, never blocks)
        run: |
          python3 tools/resolve_versions.py check || \
            echo "::warning::versions.json is stale — run the refresh workflow"
      - name: Emit matrix JSON (8 combos, 4 MC x oldest/newest Xaero)
        id: emit
        run: |
          python3 tools/resolve_versions.py matrix --tag all > /tmp/matrix.json
          {
            echo "matrix<<EOF"
            cat /tmp/matrix.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Emit E2E matrix JSON (newest Xaero only)
        id: emit-e2e
        run: |
          python3 tools/resolve_versions.py matrix --tag newest > /tmp/matrix-e2e.json
          {
            echo "matrix<<EOF"
            cat /tmp/matrix-e2e.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── Test: 8 combos (4 MC × oldest/newest Xaero)，源码兼容预警 ──
  # 目的：确保源码在全部 MC × Xaero 组合下可编译 + JUnit + C 单测通过。
  # 这里产出的 jar 只是编译载体，不发布；发布产物是 build-universal 的 universal jar。
  test:
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: C unit tests (xsmtest)
        run: |
          cmake -S src/main/c -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --target xsmtest
          XSM_TEST_MC_VERSION=${{ matrix.mc }} ./build-test/xsmtest
      - name: Compile + JUnit tests (source coverage, not published)
        run: |
          chmod +x ./gradlew
          ./gradlew build -x compileNativeWindows \
            -Pminecraft_version=${{ matrix.mc }} \
            -PxaeroMapLine=${{ matrix.xaeroLine }} \
            -PxaeroMapVersion=${{ matrix.xaeroVersion }} \
            -PfabricApiVersion=${{ matrix.fabricApi }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.mc }}-${{ matrix.xaeroVersion }}
          path: |
            build/reports/tests/test
            build/test-results/test

  # ── Universal jar: 编一个 jar，供所有版本 E2E 复用 ───────────────────────
  # 编译目标取全局最老 Xaero (1.40.14, 26.1.2 线)：引用的符号是全部支持版本集合的
  # 子集，配合 fabric.mod.json 的 "minecraft": ">=26.1"，单个 jar 通用于全部版本。
  build-universal:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: Build universal jar (oldest Xaero line)
        run: |
          chmod +x ./gradlew
          # CI ubuntu 无 MinGW → -PskipNativeWindows=true；jar 只需内含 Linux .so
          # 供 universal-e2e 使用（release 流程单独打全平台 native）。
          ./gradlew build -x compileNativeWindows \
            -PskipNativeWindows=true \
            -PxaeroMapLine=26.1.2 \
            -PxaeroMapVersion=1.40.14
      - name: Upload universal jar
        uses: actions/upload-artifact@v7
        with:
          name: universal-jar
          # 只传生产 jar：排除 -sources.jar，其 fabric.mod.json 是未展开的
          # ${version}/${loader_version} 模板，被 E2E 误载会导致 Loader 解析失败。
          path: |
            build/libs/seed-map-for-xaero-*.jar
            !build/libs/*-sources.jar

  # ── Universal client E2E gametest（生产运行，headless）────────────────────
  # 对照 Fabric 官方 CI（fabric-api/.github/workflows/build.yml client_test job）：
  # 无显示 ubuntu + xvfb + 上传截图。与旧 client-test 的区别：mod 本体不再按矩阵
  # 重新编译，而是复用 build-universal 产出的同一个 jar
  # （runProductionClientGameTestUniversal + -PuniversalJar）。因此验证的是
  # "发布的单 jar 在所有 MC × Xaero 上真实可用"，而非"该版本源码编译出的 jar 可用"。
  # 矩阵取 newest Xaero 的 4 个 MC 版本组合（由 resolve 的 matrix-e2e 输出）——
  # mixin 的运行时应用、MC/Xaero 目标方法名差异都在真实启动中暴露。
  universal-e2e:
    needs:
      - resolve
      - build-universal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix-e2e) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies (cmake/gcc/xvfb)
        run: sudo apt-get update && sudo apt-get install -y cmake gcc xvfb
      - name: Download universal jar
        uses: actions/download-artifact@v8
        with:
          name: universal-jar
          path: universal
      - name: Run client gametest (universal jar, production, headless via xvfb)
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          # 只选生产 jar，排除 -sources.jar（其 fabric.mod.json 为未展开的 ${version} 模板），
          # 并断言所选 jar 内模板已展开，防止任何错误 jar 被误载。
          UJAR=$(find universal -name 'seed-map-for-xaero-*.jar' ! -name '*-sources.jar' | head -1)
          test -n "$UJAR" || {
            echo "::error::no production universal jar found (mc=${{ matrix.mc }})"
            exit 1
          }
          unzip -p "$UJAR" fabric.mod.json | grep -qF '${' && {
            echo "::error::universal jar still carries unexpanded template: $UJAR (mc=${{ matrix.mc }})"
            exit 1
          }
          # -PuniversalJar 让 mod 本体用预构建 jar（不重编译）；-PskipNativeWindows=true
          # 规避 CI 无 MinGW 时 processClientResources → compileNativeWindows 失败。
          ./gradlew runProductionClientGameTestUniversal -PskipNativeWindows=true \
            -PuniversalJar="$UJAR" \
            -Pminecraft_version=${{ matrix.mc }} \
            -PxaeroMapLine=${{ matrix.xaeroLine }} \
            -PxaeroMapVersion=${{ matrix.xaeroVersion }} \
            -PfabricApiVersion=${{ matrix.fabricApi }} \
            --stacktrace > gametest.log 2>&1
          # 断言全部通过才算成功；挂起由 timeout-minutes 兜底 kill
          grep -q "seed-map E2E assertions passed" gametest.log || {
            echo "::error::client gametest assertions did not pass (mc=${{ matrix.mc }}, xaero=${{ matrix.xaeroVersion }})"
            exit 1
          }
      - name: Upload gametest log (diagnose hangs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-log-${{ matrix.mc }}
          path: gametest.log
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-screenshots-${{ matrix.mc }}
          path: run/screenshots
