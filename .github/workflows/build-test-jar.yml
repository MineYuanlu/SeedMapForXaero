name: build-test-jar

# 手动触发，不 bump 版本、不打 tag、不发布到 Modrinth / GitHub Release。
# 编译全平台 native（reusable-native-build）+ 汇总 universal JAR（reusable-package）供人工测试，
# 产物等同 release 产物。ref 指定构建的分支/tag/SHA；runTests 开关打包时的 C 单测。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / SHA to build (default: master)'
        required: false
        default: 'master'
      runTests:
        description: 'Run C unit tests in package job'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  natives:
    uses: ./.github/workflows/reusable-native-build.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  package:
    needs: natives
    uses: ./.github/workflows/reusable-package.yml
    with:
      ref: ${{ inputs.ref }}
      artifact-name: seed-map-for-xaero-test
      run-ctests: ${{ inputs.runTests }}
      verify-natives: true
    secrets: inherit
